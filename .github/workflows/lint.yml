name: Lint

# Validate configuration before it merges. tests.yml / production-sync.yml only
# run peribolos on push to main (i.e. after merge), so a malformed org config
# isn't caught until the hourly sync is already broken. These jobs gate on
# pull_request instead.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  yamllint:
    name: yamllint (configs)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run yamllint
        # Lints every YAML file in the repo (org/team configs, allstar, settings,
        # workflows) using .yamllint.yml. Fails on syntax errors, ignores style.
        run: pipx run --spec 'yamllint==1.38.0' yamllint .

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
