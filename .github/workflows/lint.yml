name: Lint

# Validate configuration before it merges. tests.yml / production-sync.yml only
# run peribolos on push to main (i.e. after merge), so a malformed org config
# isn't caught until the hourly sync is already broken. These jobs gate on
# pull_request instead.
on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: read-all

jobs:
  yamllint:
    name: yamllint (configs)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run yamllint
        # Lints every YAML file in the repo (org/team configs, allstar, settings,
        # workflows) using .yamllint.yml. Fails on syntax errors, ignores style.
        run: pipx run --spec 'yamllint==1.38.0' yamllint .

  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit # TODO: change to 'egress-policy: block' after couple of runs

      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Run actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 # 1.7.12
        with:
          args: -color
