# Repo-level override of allstar/scorecard.yaml. This repo only stores org
# configuration, docs and workflows (no code), so checks about code, releases,
# packaging, fuzzing, vulnerabilities, contributors or full review/maintenance
# activity are skipped. The check list replaces the org-level one.
#
# The threshold is lowered from the org-level 10 because a perfect score is not
# realistic for every remaining check (e.g. Branch-Protection with admin bypass).
threshold: 5
checks:
- "Branch-Protection"
- "CI-Tests"
- "Dangerous-Workflow"
- "Dependency-Update-Tool"
- "License"
- "Pinned-Dependencies"
- "SAST"
- "Security-Policy"
- "Token-Permissions"
- "Webhooks"
